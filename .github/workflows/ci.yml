name: CI/CD - Pipeline de Integracao e Entrega Continua

# Gatilhos: quando o workflow deve rodar
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      # Passo 1: baixa o codigo do repositorio para o runner
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Passo 2: instala o Python na versao especificada
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Passo 3: instala as dependencias do projeto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html

      # Passo 4: verifica qualidade/estilo do codigo
      - name: Lint com flake8
        run: |
          flake8 src/ tests/ --max-line-length=100

      # Passo 5: executa os testes automatizados e gera relatorio HTML
      - name: Rodar testes e gerar relatorio HTML
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --html=report/index.html --self-contained-html

      # Passo 6: envia o relatorio como artefato para o GitHub Pages
      - name: Enviar relatorio como artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

  deploy:
    name: Deploy (CD)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4